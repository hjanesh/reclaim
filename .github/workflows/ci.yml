name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Runtime is pure stdlib; only the dev tools are needed for lint + tests.
      # (pytest reads [tool.pytest] pythonpath=["lib"] so no install of the
      #  package itself is required for the test run.)
      - name: Install dev tools
        run: python -m pip install --upgrade pip pytest ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q
